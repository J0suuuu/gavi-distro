# gavi_burger, made with the linuxlive.com wizard on 2026-11-04.
# Build it in your own GitHub from https://github.com/Eric-Ness/linuxlive-distro (see README.md)
schema_version: 1
name: "gavi_burger"
version: "0.1"
base: ubuntu
desktop: gnome
apps:
  - firefox
branding:
  wallpaper: assets/wallpaper.png
  logo: assets/logo.png
  accent_color: "#e0661f"
settings:
  autologin: true
firefox:
  homepage: "https://gaviburger.com/index.php?screen=Pantalla+1"
kiosk:
  app: firefox
persistence: true
# Your own additions. Scripts and repos run as root; read them before you share the distro.
packages:
  - xdotool
  - openssh-server
  - network-manager
  - wlr-randr
  # --- watchdog de pantalla negra ---
  - imagemagick        # magick/convert: mide el % de pixeles negros
  - grim               # captura en Wayland/wlroots (cage)
  - libglib2.0-bin     # gdbus: captura de respaldo
  - scrot              # captura de respaldo si algun dia es X11
  # --- ya las usan tus otros scripts (la base minimizada puede no traerlas) ---
  - curl               # gavi-net-watchdog.sh
  - python3            # reboot-agent.py y keep-displays-1080p.sh
  - ca-certificates    # HTTPS de gaviburger.com en python/urllib
  - procps             # pgrep / pkill

scripts:
  build:
    - scripts/build.sh
